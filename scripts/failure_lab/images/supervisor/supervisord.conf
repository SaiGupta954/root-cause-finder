[supervisord]
nodaemon=true
logfile=/dev/null  ; nodaemon mode already prints its log to stdout
logfile_maxbytes=0
loglevel=info
user=root

[program:app]
command=%(ENV_APP_CMD)s
autostart=true
autorestart=true
startsecs=3
startretries=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
