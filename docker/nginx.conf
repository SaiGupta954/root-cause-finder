server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 21m;  # the API's own limit is 20 MB and gives the friendly message

    # Resolve "backend" through Docker's DNS on each request, so a rebuilt backend (new IP) keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_read_timeout 300s;  # the LLM step can take a minute or more on CPU
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
